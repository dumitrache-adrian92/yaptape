name:                yaptape
version:             0.1.0.0
license:             BSD-3-Clause
author:              "Adrian-George Dumitrache"
copyright:           "2026 Adrian-George Dumitrache"

extra-source-files:
- README.md

ghc-options:
- -Wall
# - -Werror
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

executables:
  yaptape-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
      yaptape

library:
  source-dirs:
    - src


tests:
  yaptape-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
      - hspec
      - yaptape
      - servant-client
      - warp >= 3.2.4
      - http-client
      - http-types

dependencies:
- base
- servant
- servant-server
- transformers
- aeson
- wai
- warp
