name:                yaptape
version:             0.1.0.0
license:             BSD-3-Clause
author:              "Adrian-George Dumitrache"
copyright:           "2026 Adrian-George Dumitrache"

extra-source-files:
- README.md
- compose.yaml
- db/migrations/001_create_mixtapes.sql
- db/migrations/002_add_field_limits.sql
- static/css/app.css
- static/favicon.svg
- static/js/copy-link.js
- static/js/create.js
- static/js/htmx.min.js
- static/js/HTMX-LICENSE.txt
- static/js/playback.js

data-files:
- static/css/app.css
- static/favicon.svg
- static/js/*.js

ghc-options:
- -Wall
# - -Werror
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

executables:
  yaptape-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
      yaptape

library:
  source-dirs:
    - src
  other-modules:
    - Yaptape.YouTube.Internal

tests:
  yaptape-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
      - hspec
      - yaptape
      - servant-client
      - warp >= 3.2.4
      - http-client
      - http-types
      - text
      - time

dependencies:
- base
- filepath
- servant
- servant-server
- transformers
- aeson
- wai
- warp
- text
- time
- bytestring
- network-uri
- http-types
- http-api-data
- lucid
- servant-lucid
- hasql
- hasql-pool
- hasql-transaction
- uuid
- base64-bytestring
